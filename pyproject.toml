[project]
name = "torchdiagram"
version = "0.1.0"
description = "PyTorch architecture diagram generator — neural network diagram, model visualization as SVG or TikZ/LaTeX"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Murat Raimbekov" }
]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
]
keywords = [
    "pytorch",
    "neural-network",
    "architecture-diagram",
    "model-visualization",
    "visualization",
    "diagram-generator",
    "deep-learning",
    "tikz",
    "latex",
    "svg",
    "torch-fx",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Visualization",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/raimbekovm/torchdiagram"
Issues = "https://github.com/raimbekovm/torchdiagram/issues"
Changelog = "https://github.com/raimbekovm/torchdiagram/blob/main/CHANGELOG.md"

[project.scripts]
torchdiagram = "torchdiagram.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.0",
    "ruff>=0.8",
]

# CI and Linux dev boxes get CPU-only torch wheels (~200 MB instead of multi-GB
# CUDA builds); a diagram tool never needs a GPU. macOS/Windows use PyPI wheels.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "D"]
# Shape annotations render as "1×3×224×224" — the multiplication sign is intentional.
allowed-confusables = ["×"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.10"
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
